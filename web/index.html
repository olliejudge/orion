<!doctype html>
<html lang="en" data-theme="vision">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Orion</title>
    <script>
      // Apply the remembered theme before first paint (see src/ui/theme.ts).
      try {
        if (localStorage.getItem("orion.theme") === "night") document.documentElement.dataset.theme = "night";
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
