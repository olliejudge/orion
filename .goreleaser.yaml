# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Release config for orion. Runs on a macOS runner (see .github/workflows/release.yml):
# darwin builds need cgo (FSEvents); linux builds are pure Go and cross-compile.
version: 2

project_name: orion

# For local snapshots. The release workflow builds web/ in its own step, with
# no secrets in the environment, and runs GoReleaser with --skip=before.
before:
  hooks:
    - pnpm -C web install --frozen-lockfile
    - pnpm -C web build

builds:
  - id: darwin
    main: ./cmd/orion
    binary: orion
    goos: [darwin]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=1
      # Go passes -arch to clang itself, so darwin/amd64 cross-compiles on an
      # arm64 runner. Without an explicit minimum, the cgo objects are stamped
      # with the runner's macOS version and refuse to run on older systems.
      - CGO_CFLAGS=-O2 -g -mmacosx-version-min=13.0
      - CGO_LDFLAGS=-mmacosx-version-min=13.0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/olliejudge/orion/internal/version.Version={{ .Version }}
  - id: linux
    main: ./cmd/orion
    binary: orion
    goos: [linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/olliejudge/orion/internal/version.Version={{ .Version }}

# Sign (hardened runtime, Apple timestamp) and notarize the darwin binaries with
# GoReleaser's built-in quill, before they are archived. Skipped unless the
# MACOS_SIGN_P12 secret is set, so local snapshots and releases without the
# Apple secrets still work; they then ship unsigned. Setup: docs/RELEASING.md.
notarize:
  macos:
    - ids: [darwin]
      enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}" # base64 of the .p12
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}" # base64 of the .p8
        # Don't block the release on Apple's review. A brand-new developer
        # team's first notarization goes through a long in-depth review that
        # can run well past an hour, and quill signs its App Store Connect API
        # token for timeout + 2m; Apple rejects tokens living longer than 20m,
        # so the wait can't be raised enough to cover it anyway. With wait
        # false, GoReleaser submits and moves on: the binary is already
        # signed, notarization finishes later on Apple's side, and Gatekeeper
        # fetches the result online on first run (see docs/RELEASING.md).
        # `timeout` only applies when wait is true, so it's omitted here.
        wait: false

archives:
  - id: orion
    ids: [darwin, linux]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Commit-derived mtimes (with mod_timestamp on the builds) keep the archives,
    # and so checksums.txt, identical across rebuilds of the same commit. Signed
    # darwin binaries are the exception: their signature carries a timestamp.
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^build(\(.+\))?:'
      - '^style(\(.+\))?:'

release:
  github:
    owner: olliejudge
    name: orion
  prerelease: auto

# GoReleaser deprecated `brews` (formulae) in v2.10 in favour of casks for
# pre-built binaries. `brew install olliejudge/tap/orion` resolves the cask.
homebrew_casks:
  - name: orion
    ids: [orion]
    binaries: [orion]
    homepage: https://github.com/olliejudge/orion
    description: Live, animated map of a git repository across all its worktrees
    license: MIT
    skip_upload: auto
    repository:
      owner: olliejudge
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: olliejudge
      email: olliejudge@users.noreply.github.com
    commit_msg_template: "chore: update orion cask to {{ .Tag }}"
    dependencies:
      - formula: git
    caveats: |
      Run `orion` inside any git repository. It serves on 127.0.0.1 only.
    # Clear the quarantine bit so Gatekeeper doesn't block the first run of an
    # un-notarized binary. Harmless on a notarized one; drop it once a
    # notarized release has been verified (docs/RELEASING.md). Written as
    # Homebrew's declarative postflight_steps (Homebrew >= 7.0.4); GoReleaser
    # 2.18's `hooks` emit the deprecated `postflight` block. {{staged_path}} is
    # a Homebrew token, so it is escaped from GoReleaser's own templating.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/orion"]
        end
      end
