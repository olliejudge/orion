name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: git version
        run: git --version
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - name: go test
        run: go test -race -count=1 ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect web/
        id: detect
        run: |
          if [ -f web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 12
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - if: steps.detect.outputs.present == 'true'
        run: pnpm -C web install --frozen-lockfile
      - if: steps.detect.outputs.present == 'true'
        run: pnpm -C web lint
      - if: steps.detect.outputs.present == 'true'
        run: pnpm -C web test
      - if: steps.detect.outputs.present == 'true'
        run: pnpm -C web build
      - if: steps.detect.outputs.present != 'true'
        run: echo "web/ not present yet; nothing to check"

  e2e:
    name: e2e (Playwright, macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm -C web install --frozen-lockfile
      - name: Build orion (web + Go)
        run: make build
      - name: Install Chromium for Playwright
        run: pnpm -C web exec playwright install chromium
      - name: Run Playwright smoke test
        run: pnpm -C web e2e
      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: |
            web/e2e/__screenshots__/
            web/test-results/
          if-no-files-found: ignore
