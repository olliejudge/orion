name: release

on:
  push:
    tags: ["v*"]

# This is the only workflow holding a write token and the tap PAT: grant
# nothing by default, and only the release job gets contents: write.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    # macOS: the darwin builds need cgo (FSEvents). GoReleaser cross-compiles
    # darwin/amd64 (clang -arch x86_64, added by Go) and the pure-Go linux builds.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changelog needs full history and tags
          persist-credentials: false
      # No caches: a poisoned cache must not reach a release build.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # Web assets are built here, with no secrets in the environment, instead
      # of in GoReleaser's before-hooks (skipped below with --skip=before).
      - name: Build web assets
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web build
      - name: Test
        run: go test ./...
      # Stable tags only; prerelease tags (v1.2.3-rc.1) skip both checks.
      # - A stable tag without the tap token would publish the GitHub release
      #   and then fail the cask push (prereleases skip the tap via
      #   skip_upload: auto).
      # - The Apple secrets must be all set or all unset: a partial setup would
      #   ship binaries that are signed but not notarized, or fail mid-release.
      # Only booleans reach this step, never the secret values.
      - name: Check release secrets
        env:
          HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN != '' }}
          HAS_MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 != '' }}
          HAS_MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD != '' }}
          HAS_MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY != '' }}
          HAS_MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID != '' }}
          HAS_MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID != '' }}
          TAG: ${{ github.ref_name }}
        run: |
          # Build metadata (v1.2.3+build-5) is not a prerelease marker.
          base=${TAG%%+*}
          case "$base" in
            *-*)
              echo "prerelease tag $TAG: the Homebrew cask is not updated; secret checks skipped"
              exit 0
              ;;
          esac
          if [ "$HAS_TAP_TOKEN" != "true" ]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is not set; stable tag $TAG would release but fail the tap push"
            exit 1
          fi
          set_count=0
          missing=""
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID; do
            has_var="HAS_$name"
            if [ "${!has_var}" = "true" ]; then
              set_count=$((set_count + 1))
            else
              missing="$missing $name"
            fi
          done
          case "$set_count" in
            0) echo "::warning::No Apple signing secrets are set; stable tag $TAG ships unsigned macOS binaries (see docs/RELEASING.md)" ;;
            5) echo "Apple signing secrets set: macOS binaries will be signed and notarized" ;;
            *)
              echo "::error::Apple signing secrets are only partly set; missing:$missing. Set all five or none (see docs/RELEASING.md)"
              exit 1
              ;;
          esac
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --skip=before
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # macOS signing + notarization (docs/RELEASING.md). Unset secrets
          # arrive empty, and GoReleaser then skips signing.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
